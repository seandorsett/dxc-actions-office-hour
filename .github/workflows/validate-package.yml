# Manual local-logic checks, not a claim of live feature enforcement.
name: Validate Office Hour package
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared validation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test offline logic and workflow structure
        run: python -m unittest discover -s tests -v
