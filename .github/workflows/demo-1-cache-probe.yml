# Reusable helper; caller modes are enforced despite this job requesting write.
name: Demo 1 helper - Cache permission ceiling
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Attempt seed restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .demo-cache/seed
          key: dxc-oh-${{ github.run_id }}-${{ github.run_attempt }}-seed
      - name: Assert observed restore and prepare candidate save
        env:
          MODE: ${{ inputs.mode }}
        run: python scripts/cache_probe.py "$MODE"
      - name: Attempt candidate save
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .demo-cache/probe
          key: dxc-oh-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode }}

