# Read-only API demonstration; a small repo does not prove the 2,500+ threshold.
name: Demo 4 - Bounded workflow reporting
on:
  workflow_dispatch:
    inputs:
      start_date:
        type: string
        description: First UTC date, inclusive
        default: '2026-09-10'
      end_date:
        type: string
        description: Last UTC date, inclusive
        default: '2026-10-13'
      per_page:
        type: choice
        description: Use 2 to show pagination in a small demo repository
        options: ['2', '10', '100']
        default: '2'
permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enumerate explicit UTC time windows
        env:
          GITHUB_TOKEN: ${{ github.token }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PER_PAGE: ${{ inputs.per_page }}
        run: python scripts/demo_api.py reporting --start-date "$START_DATE" --end-date "$END_DATE" --per-page "$PER_PAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-output/
          retention-days: 7
          if-no-files-found: error

