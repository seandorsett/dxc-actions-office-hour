# Reproducible GitHub-native deck build; no local skill assets required.
name: Build DXC presentation
on:
  workflow_dispatch:
permissions:
  contents: read
cache-mode: none

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install declared presentation dependency
        run: python -m pip install --disable-pip-version-check -r requirements-presentation.txt
      - name: Build from original template
        run: python scripts/generate_deck.py
      - name: Check dimensions, transcript fidelity, and 50/10 timing
        run: python scripts/check_deck.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dxc-office-hour-deck-${{ github.run_id }}
          path: outputs/slides/dxc-actions-office-hour-2026-10-13.pptx
          retention-days: 14
          if-no-files-found: error

