# Seed at least one day before presenting; inspect after natural expiry/cleanup.
# The retained 14-day receipt is separate from the one-day target artifact.
name: Demo 3 - Natural artifact expiration
run-name: Artifact expiry | ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [seed, inspect]
        default: seed
      seed_run_id:
        type: string
        description: Successful seed run ID; required for inspect
        default: ''
permissions:
  contents: read
  actions: read
cache-mode: none

jobs:
  seed:
    if: inputs.operation == 'seed'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create harmless expiry marker
        run: |
          mkdir -p demo-output/expiry-target
          printf 'Harmless Office Hour artifact\n' > demo-output/expiry-target/marker.txt
      - name: Upload one-day artifact
        id: target
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expiry-demo-${{ github.run_id }}
          path: demo-output/expiry-target/
          retention-days: 1
          if-no-files-found: error
      - name: Record artifact receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.target.outputs.artifact-id }}
        run: python scripts/demo_api.py artifact-seed --artifact-id "$ARTIFACT_ID"
      - name: Preserve receipt independently
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expiry-receipt-${{ github.run_id }}
          path: demo-output/receipt.json
          retention-days: 14
          if-no-files-found: error
  inspect:
    if: inputs.operation == 'inspect'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate seed run ID
        env:
          SEED_RUN_ID: ${{ inputs.seed_run_id }}
        run: |
          [[ "$SEED_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "ERROR: Enter the successful seed run ID."; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Download retained seed receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: expiry-receipt-${{ inputs.seed_run_id }}
          path: receipt-input/
          run-id: ${{ inputs.seed_run_id }}
          github-token: ${{ github.token }}
      - name: Compare actual API visibility against original receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEED_RUN_ID: ${{ inputs.seed_run_id }}
        run: python scripts/demo_api.py artifact-inspect --receipt receipt-input/receipt.json --seed-run-id "$SEED_RUN_ID"
      - name: Retain observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expiry-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-output/
          retention-days: 7
          if-no-files-found: warn

