# Usage: inspect/create -> record ID -> activate -> probes -> cleanup.
# Prerequisites: disposable repository, protected demo-admin environment,
# DEMO_POLICY_ADMIN_TOKEN (Administration write, Actions write, Contents write).
name: Demo 2 - Workflow policy control
run-name: Policy control | ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        description: Operation on the isolated demo policy
        options: [inspect, create-evaluate, create-active, activate, probe-allowed, probe-blocked, cleanup]
        default: inspect
      policy_id:
        type: string
        description: ID returned by create; required for activate or cleanup
        default: ''
permissions:
  contents: read
cache-mode: none
concurrency:
  group: dxc-office-hour-policy-management
  cancel-in-progress: false

jobs:
  manage:
    environment: demo-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "ERROR: Use the default branch."; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Execute scoped policy operation
        env:
          GITHUB_TOKEN: ${{ secrets.DEMO_POLICY_ADMIN_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OPERATION: ${{ inputs.operation }}
          POLICY_ID: ${{ inputs.policy_id }}
        run: python scripts/demo_api.py policy --operation "$OPERATION" --policy-id "$POLICY_ID"

