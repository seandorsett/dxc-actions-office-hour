# Harmless target. The demo policy permits manual dispatch, not repository_dispatch.
name: Demo 2 target - Harmless policy probe
run-name: Policy probe | ${{ inputs.probe_label || github.event.client_payload.probe_label || 'manual' }}
on:
  workflow_dispatch:
    inputs:
      probe_label:
        type: string
        default: manual
  repository_dispatch:
    types: [office-hour-policy-probe]
permissions: {}
cache-mode: none

jobs:
  harmless:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Record actual permitted execution
        env:
          EVENT: ${{ github.event_name }}
        run: |
          printf 'Harmless workflow executed for event: %s\n' "$EVENT"
          printf '## Harmless probe executed\n\nEvent: `%s`\n' "$EVENT" >> "$GITHUB_STEP_SUMMARY"

