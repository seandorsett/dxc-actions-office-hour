# AFTER: supply the successful Demo 1 BEFORE run ID.
# One new setting, cache-mode: read, allows restore but denies save.
# Cleanup: optionally remove only the matching dxc-oh-simple-* demo caches.
name: Demo 1 - AFTER - Read-only cache
on:
  workflow_dispatch:
    inputs:
      before_run_id:
        description: Full run ID from the successful Demo 1 BEFORE summary
        required: true
        type: string
permissions:
  actions: read
cache-mode: read

jobs:
  example:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate the before run ID
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_RUN_ID: ${{ inputs.before_run_id }}
        run: |
          [[ "$BEFORE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
            { echo '::error::Copy the full numeric run ID from Demo 1 BEFORE.'; exit 1; }
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BEFORE_RUN_ID" > before-run.json; then
            echo "::error::Cannot read Before run $BEFORE_RUN_ID. Copy its full run ID from the summary or Actions run URL."
            exit 1
          fi
          jq -e '(.path|split("@")[0])==".github/workflows/demo-1-before.yml"
            and .status=="completed" and .conclusion=="success"' before-run.json > /dev/null ||
            { echo '::error::The ID must identify a successful Demo 1 BEFORE run in this repository.'; exit 1; }
          echo "Validated successful Before run: $BEFORE_RUN_ID"
      - name: Restore the trusted cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: demo-cache
          key: dxc-oh-simple-before-${{ inputs.before_run_id }}
          fail-on-cache-miss: true
      - name: Check the restored content
        run: |
          test "$(cat demo-cache/message.txt)" = 'trusted sample'
          echo 'Trusted content restored successfully.'
      - name: Attempt a new save with read-only access
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: demo-cache
          key: dxc-oh-simple-after-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Show that the candidate cache was not saved
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: dxc-oh-simple-after-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$KEY" --jq '.total_count')
          test "$count" = '0' || { echo '::error::Unexpected saved cache. Inspect the cache-mode logs.'; exit 1; }
          {
            echo '## AFTER: cache-mode is read'
            echo 'Trusted content restored. The new candidate key is absent from cache inventory.'
            echo 'Open the save step to see the service-enforced denial.'
            echo 'A green save step alone would not prove that anything was saved.'
          } >> "$GITHUB_STEP_SUMMARY"
