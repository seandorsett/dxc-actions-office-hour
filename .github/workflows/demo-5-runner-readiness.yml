# Read-only. Requires RUNNER_READ_TOKEN; GITHUB_TOKEN lacks runner admin access.
name: Demo 5 - Runner upgrade readiness
on:
  workflow_dispatch:
    inputs:
      versions:
        type: string
        description: Comma-separated runner versions to query
        default: '2.328.0,2.329.0'
      scope:
        type: choice
        options: [repository, organization]
        default: repository
      include_inventory:
        type: boolean
        description: Also inspect real runners; report only, no changes
        default: false
permissions:
  contents: read
cache-mode: none

jobs:
  audit:
    environment: demo-admin
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Require default branch
        env:
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$REF" = "refs/heads/$DEFAULT_BRANCH" || { echo "ERROR: Use the default branch."; exit 1; }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Query registration and runtime deadlines
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_READ_TOKEN }}
          VERSIONS: ${{ inputs.versions }}
          SCOPE: ${{ inputs.scope }}
          ORGANIZATION: ${{ vars.RUNNER_AUDIT_ORG }}
          INCLUDE_INVENTORY: ${{ inputs.include_inventory }}
        run: |
          args=()
          if [ "$INCLUDE_INVENTORY" = "true" ]; then args+=(--include-inventory); fi
          python scripts/demo_api.py runners --versions "$VERSIONS" --scope "$SCOPE" --organization "$ORGANIZATION" "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: demo-output/
          retention-days: 7
          if-no-files-found: error

